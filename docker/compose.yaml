# Single-node AutoMQ with MinIO as its object storage, for TRACEWAKE's CI proof and local runs.
#
# Adapted from AutoMQ's docker/docker-compose.yaml at tag 1.7.4 (Apache License 2.0,
# https://github.com/AutoMQ/automq/blob/1.7.4/docker/docker-compose.yaml). Changes: the broker
# port is published on the host and advertised as localhost:9092 so clients on the host can
# connect; the fixed subnet was dropped; and the MinIO images come from quay.io, because the
# minio/minio and minio/mc tags on Docker Hub were no longer available on 2026-09-19.
# Everything else, including the heap settings, is theirs.
#
#   docker compose -f docker/compose.yaml up -d
#   python scripts/wait_for_broker.py localhost:9092
#   tracewake proof --bootstrap localhost:9092
#   docker compose -f docker/compose.yaml down -v

services:
  minio:
    container_name: "minio"
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DOMAIN=minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "/data", "--console-address", ":9001" ]
    networks:
      automq_net:
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://minio:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 3

  mc:
    container_name: "mc"
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/automq-data;
      /usr/bin/mc rm -r --force minio/automq-ops;
      /usr/bin/mc mb minio/automq-data;
      /usr/bin/mc mb minio/automq-ops;
      /usr/bin/mc anonymous set public minio/automq-data;
      /usr/bin/mc anonymous set public minio/automq-ops;
      tail -f /dev/null
      "
    networks:
      - automq_net

  server1:
    container_name: "automq-single-server"
    image: automqinc/automq:1.7.4
    stop_grace_period: 1m
    ports:
      - "9092:9092"
    environment:
      - KAFKA_S3_ACCESS_KEY=minioadmin
      - KAFKA_S3_SECRET_KEY=minioadmin
      - KAFKA_HEAP_OPTS=-Xms1g -Xmx4g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=1G
      - CLUSTER_ID=3D4fXN-yS1-vsQ8aJ_q4Mg
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
        /opt/automq/kafka/config/kraft/server.properties \
        --override cluster.id=$$CLUSTER_ID \
        --override node.id=0 \
        --override controller.quorum.voters=0@server1:9093 \
        --override controller.quorum.bootstrap.servers=server1:9093 \
        --override advertised.listeners=PLAINTEXT://localhost:9092 \
        --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
        --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
    networks:
      automq_net:
    depends_on:
      - minio
      - mc

networks:
  automq_net:
    name: automq_net
    driver: bridge
